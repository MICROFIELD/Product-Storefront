kind = "web"
previewPath = "/"
title = "Product Storefront"
description = "A polished ecommerce storefront for browsing products, filtering collections, adding items to a cart, and starting checkout."
version = "1.0.0"
id = "artifacts/product-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22421

[services.development]
run = "pnpm --filter @workspace/product-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/product-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/product-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22421"
BASE_PATH = "/"
